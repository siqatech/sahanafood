# Sahana Food en UNA máquina (docs/17, puesta en marcha).
#
# Para qué sirve: levantar el sistema completo en un servidor y empezar a
# vender. Es la forma de arrancar de los tres operadores piloto que el gate de
# F5 exige, y de cualquier cliente pequeño — un servidor de 4 GB atiende de
# sobra a un restaurante con dos locales.
#
# Para qué NO sirve: escala horizontal, alta disponibilidad ni copias de
# seguridad gestionadas. Eso es Terraform sobre proveedor gestionado, y va
# aparte (T3.16, bloqueado por DT-02). Aquí Postgres corre en el mismo servidor
# y **las copias son responsabilidad de quien lo levanta**: ver el runbook.
#
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env up -d
#
# Antes de la primera vez: copiar `.env.example` a `.env` y rellenar los
# secretos. El proceso NO arranca con los valores de desarrollo, a propósito.

name: sahana

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-sahana}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?falta POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sahana}
      # Contraseñas de los roles de la aplicación. Sin ellas NO se levanta: el
      # script de init las exige y su valor por defecto es de desarrollo, o sea
      # público. Un rol de aplicación con contraseña publicada lee los pedidos
      # de todos los clientes.
      SAHANA_APP_PASSWORD: ${SAHANA_APP_PASSWORD:?falta SAHANA_APP_PASSWORD}
      SAHANA_MIGRATOR_PASSWORD: ${SAHANA_MIGRATOR_PASSWORD:?falta SAHANA_MIGRATOR_PASSWORD}
      SAHANA_SUPPORT_PASSWORD: ${SAHANA_SUPPORT_PASSWORD:?falta SAHANA_SUPPORT_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Roles y extensiones. Solo se ejecutan al CREAR el volumen: en un
      # servidor ya arrancado hay que aplicarlos a mano (ver runbook).
      - ./init:/docker-entrypoint-initdb.d:ro
    # NO se publica el puerto. Una base de datos accesible desde internet es la
    # forma más común de perder los datos de un cliente, y aquí no hace falta:
    # quien la consulta está en esta misma red de Docker.
    expose:
      - '5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_SUPERUSER:-sahana} -d ${POSTGRES_DB:-sahana}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly`: la cola de BullMQ vive aquí. Sin persistencia, un reinicio
    # del servidor pierde los trabajos en vuelo — y un trabajo en vuelo es un
    # pedido que la cocina todavía no ha visto.
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Migraciones como servicio de ARRANQUE, no como paso manual.
  #
  # Corre con el rol MIGRADOR —dueño del esquema— y termina. La API espera a que
  # termine bien. Dejarlo a mano es cómo se despliega una versión contra un
  # esquema viejo un viernes por la noche.
  migrate:
    image: ${SAHANA_API_IMAGE:-sahana/api:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?falta MIGRATION_DATABASE_URL}
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?falta CREDENTIALS_MASTER_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?falta JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET}
    # El COMPILADO, no el fuente: la imagen de producción no trae `tsx` ni
    # `src/`. Un compose que invoca al fuente funciona en la máquina de quien lo
    # escribió y falla la primera vez que alguien despliega la imagen.
    command: ['node', 'dist/database/migrate.js']

  api:
    image: ${SAHANA_API_IMAGE:-sahana/api:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: &api_env
      NODE_ENV: production
      API_PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CREDENTIALS_MASTER_KEY: ${CREDENTIALS_MASTER_KEY:?falta CREDENTIALS_MASTER_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?falta JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?falta JWT_REFRESH_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      PUBLIC_TRACKING_BASE_URL: ${PUBLIC_TRACKING_BASE_URL:-}
    ports:
      - '${API_BIND:-127.0.0.1}:3000:3000'

  # El worker va en su PROPIO contenedor y no como hilo de la API.
  #
  # Se escala distinto —la API crece con las peticiones, el worker con los
  # eventos—, y sobre todo: un despliegue de la API no puede interrumpir un
  # relay a mitad de tanda. Con dos contenedores, reiniciar uno no toca al otro.
  worker:
    image: ${SAHANA_API_IMAGE:-sahana/api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *api_env
    command: ['node', 'dist/workers/main.js']

  web:
    image: ${SAHANA_WEB_IMAGE:-sahana/web:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      # Dentro de la red de Docker: la tienda habla con la API por nombre de
      # servicio, no por el dominio público. Un salto de más por internet en
      # cada carga de catálogo se nota en el móvil de quien está pidiendo.
      SAHANA_API_URL: ${SAHANA_API_URL:-http://api:3000}
      # Dominio del panel. Sin él, `/panel` se sirve también en los dominios de
      # las tiendas de los clientes; con él, ahí responde 404 (ver runbook §6).
      SAHANA_PANEL_HOST: ${SAHANA_PANEL_HOST:-}
    ports:
      - '${WEB_BIND:-127.0.0.1}:3001:3001'

volumes:
  pgdata:
  redisdata:
