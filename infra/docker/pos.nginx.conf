# Servidor estático del POS/KDS.
#
# Tres reglas, y las tres existen por un fallo concreto de una PWA en una tablet
# de local, no por gusto.

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;

  # 1. `sw.js` NUNCA se cachea.
  #
  # El navegador comprueba el service worker en cada carga, pero respeta la
  # caché HTTP al hacerlo. Con la cabecera por defecto, una tablet podría seguir
  # recibiendo el service worker viejo durante días —de su propia caché— y con
  # él la aplicación vieja entera. Es el fallo más caro de esta imagen porque no
  # se ve: el POS funciona, con el código de antes.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Service-Worker-Allowed "/";
    try_files $uri =404;
  }

  # 2. El HTML tampoco. Es lo que apunta a los `assets` con hash: cacheado,
  #    apuntaría a archivos de una versión que ya no está.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # 3. Los `assets` llevan hash en el nombre, así que su contenido no cambia
  #    nunca: se cachean para siempre. Es lo que hace que abrir el POS en una
  #    conexión de local no cueste una descarga entera cada mañana.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # El resto: aplicación de una sola página, así que cualquier ruta desconocida
  # devuelve el HTML y la aplicación decide. Sin esto, recargar dentro del POS
  # —F5 en una pantalla que no es la de inicio— daría 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
