name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

# Cancela ejecuciones previas del mismo ref para ahorrar minutos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # Calidad estática: lint, tipos, fronteras de módulo. Sin BD.
  # ---------------------------------------------------------------------------
  static:
    name: Lint · Types · Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ESLint (incluye regla anti-number monetario)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Fronteras de módulos (dependency-cruiser)
        run: pnpm depcruise
      # Sin base de datos: es análisis de los .sql. Comprueba que ninguna
      # migración rompe a la versión anterior, que es de lo que depende poder
      # revertir un despliegue SIN tocar la base (docs/17, T5.35).
      - name: Migraciones compatibles con la versión anterior
        run: pnpm migrations:check
      - name: Formato (prettier)
        run: pnpm format:check

  # ---------------------------------------------------------------------------
  # Dominio: pruebas unitarias + property tests. Gate: 100% de ramas en dinero.
  # ---------------------------------------------------------------------------
  domain:
    name: Domain (Money · 100% ramas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pruebas de dominio con cobertura
        run: pnpm --filter @sahana/domain test:coverage

  # ---------------------------------------------------------------------------
  # Integración: RLS, esquema y outbox contra Postgres 16 real.
  # Gates de Fase 3: fuga de aislamiento ×1000, esquema RLS, exactamente-una-vez.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (RLS · Schema · Outbox · Worker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sahana
          POSTGRES_PASSWORD: sahana_dev
          POSTGRES_DB: sahana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sahana -d sahana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # El relay del worker publica a BullMQ de verdad: sin Redis, la prueba
      # que verifica que el evento SALE del outbox y LLEGA a la cola no puede
      # ejecutarse, y ese es justo el eslabón que faltaba.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sahana_app:sahana_app_dev@localhost:5432/sahana
      MIGRATION_DATABASE_URL: postgres://sahana_migrator:sahana_migrator_dev@localhost:5432/sahana
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Crear roles (app/migrator SIN BYPASSRLS)
        run: PGHOST=localhost PGPASSWORD=sahana_dev POSTGRES_USER=sahana POSTGRES_DB=sahana bash infra/docker/init/01-roles.sh
      - name: Migraciones
        run: pnpm --filter @sahana/api migrate
      # Paso PROPIO y a propósito duplicado dentro de la suite completa (T5.31).
      #
      # El criterio del backlog es que **un cambio de prompt que degrada la
      # suite dorada no se mergea**, y para eso la señal tiene que ser legible
      # sin abrir un log de 500 tests: aquí el job se llama por su nombre y el
      # fallo sale con el motivo de negocio de cada turno. Cuesta cuatro
      # segundos; una regresión de calidad enterrada entre los demás tests
      # cuesta la confianza del dueño en su agente.
      - name: Suite dorada del agente (bloqueante)
        run: pnpm --filter @sahana/api test:golden
      - name: Pruebas de integración (incluye gates de aislamiento)
        run: pnpm --filter @sahana/api test

  # ---------------------------------------------------------------------------
  # Build de paquetes y apps.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [static, domain]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      # Presupuesto de rendimiento de la tienda (T5.14). Va aquí y no en un job
      # aparte porque necesita la compilación que se acaba de hacer, y BLOQUEA:
      # un presupuesto que solo se mira a mano se incumple el primer martes con
      # prisa, y para cuando alguien lo note la tienda ya carga en cinco
      # segundos en el móvil de un cliente en Lima.
      - name: Presupuesto de rendimiento de la tienda
        run: pnpm --filter @sahana/web budget
      # Las pruebas del POS no necesitan base de datos ni navegador: la cola
      # offline corre contra `fake-indexeddb` y el cálculo del ticket es puro.
      # Van aquí y no en el job de integración porque ese levanta Postgres para
      # nada, y un job que tarda de más acaba siendo el que alguien salta.
      - name: Pruebas del POS (cola offline y cálculo del ticket)
        run: pnpm --filter @sahana/pos test

  # ---------------------------------------------------------------------------
  # Navegador: la tienda y el PANEL, vistos como los ve quien los usa
  # (ADR-0018, salda DT-08 y cubre DT-09).
  #
  # Job propio y no un paso más del de integración porque necesita otra cosa:
  # la API y Next levantados a la vez, y un navegador. Tres fallos reales de
  # T5.08-T5.14 pasaron typecheck, lint y las 484 pruebas de la API — los tres
  # se veían igual: la página cargaba.
  #
  # El panel entra aquí por el mismo motivo y uno más: su sesión es una cookie
  # `httpOnly` puesta por el servidor de Next, así que solo un navegador con su
  # tarro de cookies recorre el camino real.
  # ---------------------------------------------------------------------------
  browser:
    name: Browser (tienda · panel)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sahana
          POSTGRES_PASSWORD: sahana_dev
          POSTGRES_DB: sahana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sahana -d sahana"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sahana_app:sahana_app_dev@localhost:5432/sahana
      MIGRATION_DATABASE_URL: postgres://sahana_migrator:sahana_migrator_dev@localhost:5432/sahana
      REDIS_URL: redis://localhost:6379
      CREDENTIALS_MASTER_KEY: ci-only-credentials-master-key-change-me
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      SAHANA_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Crear roles (app/migrator SIN BYPASSRLS)
        run: PGHOST=localhost PGPASSWORD=sahana_dev POSTGRES_USER=sahana POSTGRES_DB=sahana bash infra/docker/init/01-roles.sh
      - name: Extensiones (pgvector, con superusuario)
        run: PGPASSWORD=sahana_dev psql -h localhost -U sahana -d sahana -v ON_ERROR_STOP=1 -f infra/docker/init/02-extensions.sql
      - name: Migraciones
        run: pnpm --filter @sahana/api migrate
      # La tienda se SIEMBRA, no se construye clicando: montar el escenario por
      # interfaz multiplica el tiempo y hace que un fallo de la semilla parezca
      # un fallo de la tienda (ADR-0018).
      - name: Sembrar la tienda demo
        run: pnpm --filter @sahana/api seed:shop
      - name: Build
        run: pnpm build
      - name: Navegador (solo Chromium)
        run: pnpm --filter @sahana/web exec playwright install --with-deps chromium
      - name: Levantar la API
        run: |
          pnpm --filter @sahana/api start &
          npx --yes wait-on http://localhost:3000/api/v1/health --timeout 60000
      # Playwright levanta Next por su cuenta (webServer); la API va aparte
      # porque necesita Postgres migrado y sembrado ANTES de arrancar.
      - name: Pruebas de navegador
        run: pnpm --filter @sahana/web test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Imágenes de producción. Que compilen es parte del contrato: un Dockerfile
  # roto no se descubre al desplegar un viernes.
  #
  # Ya cazó dos fallos que `pnpm build` no puede ver, porque solo existen dentro
  # de la imagen: un `.tsbuildinfo` colado en el contexto hacía que `tsc` no
  # emitiera nada —construcción en verde, `dist` vacío— y pnpm se quedaba
  # esperando una confirmación interactiva que en un runner no llega nunca.
  # ---------------------------------------------------------------------------
  images:
    name: Imágenes (api · web)
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen de API y worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: sahana/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Imagen de la tienda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: sahana/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Análisis de composición (SCA): dependencias con vulnerabilidades conocidas.
  #
  # BLOQUEA desde el gate de F4. Estuvo en modo informativo mientras había
  # avisos altos heredados que nadie había mirado (DT-01); al saldarlos —una
  # inyección SQL en drizzle-orm, cuatro DoS en multer, cuatro crashes en los
  # exportadores de OTel— dejar el gate en `|| true` solo servía para que la
  # siguiente entrara igual de callada. Un gate que nunca falla no es un gate.
  #
  # `--audit-level high`: moderadas y bajas siguen sin romper el build. La línea
  # se sube cuando el pentest de F5 diga dónde ponerla, no antes.
  # ---------------------------------------------------------------------------
  sca:
    name: SCA (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Auditoría de dependencias (bloqueante en alto)
        run: pnpm audit --audit-level high
